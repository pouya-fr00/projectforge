packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true

# Pin vitest to the patched version (3.2.6) to remediate
# GHSA-5xrq-8626-4rwp (Vitest UI server arbitrary file read).
# better-auth lists vitest as a peerDependency so the override
# is global; targeted "better-auth>vitest" does not apply to
# peer dependencies in pnpm 11.
overrides:
  vitest: "3.2.6"
