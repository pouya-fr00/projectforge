name: Bug report
description: Report a bug in ProjectForge
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.
        Do not include secrets, tokens, passwords, private keys, or credentials.
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A short description of the bug
      placeholder: e.g. `projectforge create` fails with a lock error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ProjectForge version
      description: The version reported by `projectforge --version`
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      placeholder: e.g. v24.19.0
    validations:
      required: true
  - type: input
    id: pnpm
    attributes:
      label: pnpm version
      placeholder: e.g. 11.10.0
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command / workflow
      description: The command or workflow that triggered the bug
      placeholder: e.g. `projectforge add comments`
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Step-by-step instructions to reproduce the bug
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Any error output or logs (with secrets redacted)
      render: shell
    validations:
      required: false
